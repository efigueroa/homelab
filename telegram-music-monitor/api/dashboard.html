<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Music Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: #1db954;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b3b3b3;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #1db954;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-name {
            flex: 1;
            color: #e0e0e0;
            font-weight: 500;
        }

        .stat-value {
            color: #1db954;
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 10px;
        }

        .recent-list {
            list-style: none;
        }

        .recent-item {
            background: #252525;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #1db954;
        }

        .recent-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .artist-name {
            color: #1db954;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .song-name {
            color: #e0e0e0;
            margin-top: 4px;
        }

        .album-name {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .platform-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .platform-spotify {
            background: #1db954;
            color: #000;
        }

        .platform-youtube {
            background: #ff0000;
            color: #fff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .status-added {
            background: #1db954;
            color: #000;
        }

        .status-pending {
            background: #ffa500;
            color: #000;
        }

        .status-failed {
            background: #ff0000;
            color: #fff;
        }

        .status-skipped {
            background: #666;
            color: #fff;
        }

        .group-name {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .timestamp {
            color: #888;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            color: #1db954;
            padding: 40px;
            font-size: 1.2rem;
        }

        .error {
            background: #ff0000;
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .link {
            color: #1db954;
            text-decoration: none;
            font-size: 0.85rem;
            display: block;
            margin-top: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Telegram Music Monitor</h1>
            <p class="subtitle">Real-time music tracking from Telegram groups</p>
        </header>

        <div id="error-container"></div>

        <div class="stats-grid">
            <div class="card">
                <h2>Top Artists</h2>
                <div id="top-artists" class="loading">Loading...</div>
            </div>

            <div class="card">
                <h2>Top Albums</h2>
                <div id="top-albums" class="loading">Loading...</div>
            </div>

            <div class="card">
                <h2>Group Activity</h2>
                <div id="group-activity" class="loading">Loading...</div>
            </div>

            <div class="card">
                <h2>Platform Stats</h2>
                <div id="platform-stats" class="loading">Loading...</div>
            </div>
        </div>

        <div class="card">
            <h2>Recent Music</h2>
            <div id="recent-music" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        // Fetch data from API and update the dashboard
        async function fetchData() {
            try {
                // Fetch all data in parallel
                const [recentMusic, topArtists, topAlbums, groupActivity, platformStats] = await Promise.all([
                    fetch('/api/metrics/recent?limit=20').then(r => r.json()),
                    fetch('/api/metrics/top-artists?limit=10').then(r => r.json()),
                    fetch('/api/metrics/top-albums?limit=10').then(r => r.json()),
                    fetch('/api/metrics/group-activity').then(r => r.json()),
                    fetch('/api/metrics/platform-stats').then(r => r.json())
                ]);

                // Update UI
                updateTopArtists(topArtists);
                updateTopAlbums(topAlbums);
                updateGroupActivity(groupActivity);
                updatePlatformStats(platformStats);
                updateRecentMusic(recentMusic);
            } catch (error) {
                showError('Failed to load data: ' + error.message);
            }
        }

        function updateTopArtists(data) {
            const container = document.getElementById('top-artists');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #888;">No data yet</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="stat-item">
                    <span class="stat-name">${escapeHtml(item.Artist)}</span>
                    <span class="stat-value">${item.Count}</span>
                </div>
            `).join('');
        }

        function updateTopAlbums(data) {
            const container = document.getElementById('top-albums');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #888;">No data yet</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="stat-item">
                    <div class="stat-name">
                        ${escapeHtml(item.Album)}<br>
                        <small style="color: #888;">${escapeHtml(item.Artist)}</small>
                    </div>
                    <span class="stat-value">${item.Count}</span>
                </div>
            `).join('');
        }

        function updateGroupActivity(data) {
            const container = document.getElementById('group-activity');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #888;">No data yet</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="stat-item">
                    <span class="stat-name">${escapeHtml(item.GroupName)}</span>
                    <span class="stat-value">${item.Count}</span>
                </div>
            `).join('');
        }

        function updatePlatformStats(data) {
            const container = document.getElementById('platform-stats');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #888;">No data yet</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="stat-item">
                    <span class="stat-name">${escapeHtml(item.Platform)}</span>
                    <span class="stat-value">${item.Count}</span>
                </div>
            `).join('');
        }

        function updateRecentMusic(data) {
            const container = document.getElementById('recent-music');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="color: #888;">No music detected yet</p>';
                return;
            }

            container.innerHTML = '<ul class="recent-list">' + data.map(item => {
                const date = new Date(item.DetectedAt);
                const timeAgo = getTimeAgo(date);

                return `
                    <li class="recent-item">
                        <div class="recent-item-header">
                            <div>
                                <span class="platform-badge platform-${item.Platform}">${item.Platform}</span>
                                <span class="status-badge status-${item.LidarrStatus}">${item.LidarrStatus}</span>
                            </div>
                            <span class="timestamp">${timeAgo}</span>
                        </div>
                        ${item.ArtistName ? `<div class="artist-name">${escapeHtml(item.ArtistName)}</div>` : ''}
                        ${item.SongName ? `<div class="song-name">${escapeHtml(item.SongName)}</div>` : ''}
                        ${item.AlbumName ? `<div class="album-name">Album: ${escapeHtml(item.AlbumName)}</div>` : ''}
                        <div class="group-name">📱 ${escapeHtml(item.GroupName)} ${item.SenderUsername ? '• @' + escapeHtml(item.SenderUsername) : ''}</div>
                        <a href="${escapeHtml(item.OriginalLink)}" target="_blank" class="link">${escapeHtml(item.OriginalLink)}</a>
                    </li>
                `;
            }).join('') + '</ul>';
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);

            if (seconds < 60) return 'just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        }

        // Load data on page load
        fetchData();

        // Refresh data every 30 seconds
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
